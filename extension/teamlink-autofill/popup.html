<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TeamLink AutoFill</title>
<style>
  body{width:320px;margin:0;padding:14px 16px;font-size:13px;line-height:1.5;color:#243449;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  h1{font-size:14.5px;margin:0 0 3px;font-weight:800}
  .sub{font-size:12px;color:#6b7a90;margin:0 0 12px}
  label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;
    letter-spacing:.04em;color:#6b7a90;margin:10px 0 4px}
  input[type=text],input[type=password],input[type=email]{width:100%;box-sizing:border-box;
    padding:8px 10px;border:1px solid #dfe5ec;border-radius:8px;font-size:13px;font-family:inherit}
  button{font-family:inherit;cursor:pointer;border-radius:8px;font-weight:700;font-size:12.5px}
  .pri{width:100%;margin-top:12px;padding:9px;background:#4f46e5;color:#fff;border:0}
  .ghost{padding:7px 11px;background:#fff;color:#243449;border:1px solid #dfe5ec}
  .row{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
  .ok{font-size:12px;color:#1d7a45}
  .bad{font-size:12px;color:#b3261e;margin-top:8px}
  .muted{font-size:11.5px;color:#6b7a90}
  .note{margin-top:11px;padding:8px 10px;border-radius:8px;background:#fff7e8;
    border:1px solid #f0d9a8;color:#7a5a12;font-size:11.5px}
  hr{border:0;border-top:1px solid #eef1f6;margin:13px 0}
  .sw{display:flex;align-items:center;gap:7px;font-size:12.5px;margin-top:8px}
</style>
</head>
<body>
  <h1>TeamLink AutoFill</h1>
  <p class="sub">Fills application forms from your TeamLink profile. It never submits anything.</p>
  <div id="view"></div>
  <script src="popup.js"></script>
</body>
</html>
