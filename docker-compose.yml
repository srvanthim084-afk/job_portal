# =====================================================================
# TeamLink Job Portal — production stack
#
#   docker compose up -d
#
# Three services: Postgres, the API (which also serves the frontend), and
# nginx for TLS. A one-shot `migrate` service runs migrations before the
# API starts, so a deploy cannot serve traffic against an old schema.
#
# Postgres publishes NO port. It is reachable only on the internal network,
# which is the single most effective thing you can do for a database on a
# public VPS.
# =====================================================================

name: teamlink

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-teamlink}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # Deterministic collation, so ORDER BY does not shift between hosts.
      # C.UTF-8 keeps ORDER BY deterministic across hosts without the
      # byte-order surprises plain C gives for mixed-case names.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./deploy/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: >
      postgres -c config_file=/etc/postgresql/postgresql.conf
    # NO ports: — never expose Postgres to the internet.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-teamlink}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [internal]
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # Runs once per deploy, then exits. The API waits for it to finish.
  migrate:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: "no"
    depends_on:
      db: { condition: service_healthy }
    environment:
      # Admin connection — creates roles and tables. The API never uses this.
      ADMIN_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-teamlink}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}
      LOAD_SEED: ${LOAD_SEED:-false}
    # cwd is /app/api, not /app: node resolves `pg` by walking up from the
    # script, and the dependencies live in /app/api/node_modules. Running
    # this from /app fails with ERR_MODULE_NOT_FOUND. The migration files
    # are located relative to the script itself, so cwd does not affect them.
    working_dir: /app/api
    # LOAD_SEED=true only for a demo instance. A real deployment starts empty.
    command: >
      sh -c 'if [ "$$LOAD_SEED" = "true" ];
             then node ../tools/migrate.mjs --seed;
             else node ../tools/migrate.mjs; fi'
    networks: [internal]
    logging: *logging

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:      { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    environment:
      NODE_ENV: production
      PORT: 8080
      # Connects as app_api — the unprivileged role RLS is written against.
      # Pointing this at the postgres superuser disables every policy; the
      # server refuses to start if it detects that.
      DATABASE_URL: postgres://app_api:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-teamlink}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      SESSION_DAYS: ${SESSION_DAYS:-7}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
      EXTRA_ORIGINS: ${EXTRA_ORIGINS:-}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      TRUST_PROXY: "true"          # nginx sits in front; needed for real client IPs
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_URL: ${STORAGE_URL:-}
      STORAGE_KEY: ${STORAGE_KEY:-}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-resumes}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5242880}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      EMAIL_API_URL: ${EMAIL_API_URL:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SMS_API_KEY: ${SMS_API_KEY:-}
      SMS_API_URL: ${SMS_API_URL:-}
      SMS_SENDER_ID: ${SMS_SENDER_ID:-}
      WHATSAPP_API_KEY: ${WHATSAPP_API_KEY:-}
      WHATSAPP_API_URL: ${WHATSAPP_API_URL:-}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID:-}
      NAUKRI_API_URL: ${NAUKRI_API_URL:-}
      NAUKRI_API_KEY: ${NAUKRI_API_KEY:-}
      NAUKRI_EMPLOYER_ID: ${NAUKRI_EMPLOYER_ID:-}
      AI_API_KEY: ${AI_API_KEY:-}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-10}
      SHOW_LOGIN_HINTS: ${SHOW_LOGIN_HINTS:-true}
    volumes:
      - uploads:/app/var/uploads
    networks: [internal, edge]
    logging: *logging

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/teamlink.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    networks: [edge]
    logging: *logging

  # Renews certificates twice a day; exits immediately when nothing is due.
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: >
      sh -c 'trap exit TERM;
             while :; do certbot renew --webroot -w /var/www/certbot --quiet;
             sleep 12h & wait $${!}; done'
    logging: *logging

volumes:
  db-data:
  uploads:
  certbot-conf:
  certbot-www:

networks:
  # db + api only; no route to the outside world
  internal:
    internal: true
  # nginx + api; this is what faces the internet
  edge:
