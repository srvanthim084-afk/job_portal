# =====================================================================
# Postgres tuning for a small VPS (assumes ~2GB RAM).
# Adjust shared_buffers / effective_cache_size to your box:
#   shared_buffers       ~25% of RAM
#   effective_cache_size ~50-75% of RAM
# =====================================================================

listen_addresses = '*'          # only reachable on the internal docker network

max_connections = 100
shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 8MB
maintenance_work_mem = 128MB

# SSDs: random reads cost about the same as sequential ones, so the
# planner should stop avoiding index scans.
random_page_cost = 1.1
effective_io_concurrency = 200

wal_level = replica
max_wal_size = 2GB
min_wal_size = 256MB
checkpoint_completion_target = 0.9

# Log slow queries and every schema change — the two things you actually
# want when something goes wrong in production.
logging_collector = off                 # docker captures stdout
log_min_duration_statement = 500        # ms
log_line_prefix = '%m [%p] %u@%d '
log_checkpoints = on
log_connections = off
log_lock_waits = on
log_statement = 'ddl'
log_timezone = 'UTC'
timezone = 'UTC'

datestyle = 'iso, mdy'
default_text_search_config = 'pg_catalog.english'

# NOT set globally: a statement_timeout here would abort long migrations
# (index builds on a large table legitimately take minutes). The limits are
# applied to the app_api role only — see 0004_roles.sql.
