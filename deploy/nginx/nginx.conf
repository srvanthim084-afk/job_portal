user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # $host and the real client IP, so the API's rate limiter counts the
    # visitor rather than the proxy.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;              # do not advertise the nginx version

    # The prototype is a 1.5MB HTML file; compressing it matters more than
    # anything else here.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/javascript
                      application/javascript application/json
                      application/xml image/svg+xml;

    # Edge rate limiting, in front of the API's own limiter. This one is
    # about protecting the box; the application's is about fairness.
    limit_req_zone  $binary_remote_addr zone=api:10m   rate=20r/s;
    limit_req_zone  $binary_remote_addr zone=login:10m rate=1r/s;
    limit_conn_zone $binary_remote_addr zone=conns:10m;

    include /etc/nginx/conf.d/*.conf;
}
