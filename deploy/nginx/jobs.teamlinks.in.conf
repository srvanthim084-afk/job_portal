# The TeamLink Job Portal on its own subdomain, behind the server's existing nginx.
# Copy to /etc/nginx/sites-available/jobs.teamlinks.in, link it into sites-enabled,
# then: sudo nginx -t && sudo systemctl reload nginx && sudo certbot --nginx -d jobs.teamlinks.in
#
# The portal runs in Docker on 127.0.0.1:4323 (deploy/host-nginx.override.yml).
# Its own domain, because the portal uses /api, /job/<id>, /feeds/... at the root of
# whatever domain serves it - and on teamlink.teamlinks.in /api is TeamLink Enterprise's.

server {
    listen 80;
    listen [::]:80;
    server_name jobs.teamlinks.in;

    # resumes and recordings are uploaded through the portal
    client_max_body_size 60m;

    location / {
        proxy_pass         http://127.0.0.1:4323;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120s;      # AI scoring at the end of an interview can take a while
    }
}

