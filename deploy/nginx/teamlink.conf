# =====================================================================
# TeamLink — nginx site
#
# Replace jobs.example.com with your domain in BOTH server blocks, then:
#   ./deploy/init-letsencrypt.sh jobs.example.com you@example.com
# =====================================================================

upstream teamlink_api {
    server api:8080;
    keepalive 32;
}

# ---------------------------------------------------------------------
# HTTP — ACME challenges only; everything else goes to HTTPS.
# ---------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name jobs.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------
# HTTPS
# ---------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jobs.example.com;

    ssl_certificate     /etc/letsencrypt/live/jobs.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobs.example.com/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;

    # Session cookies are issued Secure, so the site must never be reachable
    # over plain HTTP once this is live.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # NOTE: Content-Security-Policy is deliberately NOT set here. The API
    # sets it via helmet (api/src/app.js), and two sources of CSP is a
    # reliable way to ship a policy nobody can reason about. These are the
    # headers helmet does not cover at the edge.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Resume uploads are capped at 5MB by the API; leave headroom for the
    # multipart envelope so the API returns a clean FILE_TOO_LARGE rather
    # than nginx cutting the connection.
    client_max_body_size 8m;
    client_body_timeout  60s;

    limit_conn conns 50;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Sign-in and registration: strict limit, because this is where
    # credential stuffing lands.
    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://teamlink_api;
        include /etc/nginx/proxy_params.conf;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://teamlink_api;
        include /etc/nginx/proxy_params.conf;
    }

    # Everything else is the frontend, served by the same container.
    location / {
        proxy_pass http://teamlink_api;
        include /etc/nginx/proxy_params.conf;
    }
}
